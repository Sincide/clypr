# ~/.config/hypr/exec.conf
# Startup applications and services

# Core services
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Wallpaper daemon
exec-once = swww-daemon

# Notification daemon
exec-once = dunst

# Waybar (dual vertical bars - left and right)
exec-once = waybar -c ~/.config/waybar/config-left.json &
exec-once = waybar -c ~/.config/waybar/config-right.json &

# Audio
exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber

# Network manager
exec-once = nm-applet --indicator

# Bluetooth
exec-once = blueman-applet

# Auto-mount removable media
exec-once = udiskie --tray

# Apply initial theme (if available)
exec-once = [[ -f $HOME/clypr/theme_engine/theme_data/current.json ]] && $HOME/clypr/scripts/apply_theme.sh restore

# Idle management
exec-once = hypridle

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store